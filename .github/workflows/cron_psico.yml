name: Bot Automatico PsicoVideos Imagenes IA

on:
  schedule:
    # Publica automáticamente 4 veces al día (horas UTC)
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

# Permiso obligatorio para que GitHub no dé error 403 al guardar el historial
permissions:
  contents: write

# Evita que se solapen ejecuciones si una tarda demasiado
concurrency:
  group: psicovideos
  cancel-in-progress: false

jobs:
  publicar-video:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu curl git

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install "numpy<2" "moviepy==1.0.3" "Pillow<10" edge-tts requests google-api-python-client google-auth
          # Actualizamos instagrapi para evitar errores heredados (p. ej. qe/expose)
          pip install -U instagrapi
          # Re-fijamos las versiones que necesita el script por si instagrapi las ha cambiado
          pip install "numpy<2" "moviepy==1.0.3" "Pillow<10"
          pip list 2>/dev/null | grep -i -E "instagrapi|moviepy|pillow|numpy"

      - name: Fabricar y enviar el vídeo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTA_USER: ${{ secrets.INSTA_USER }}
          INSTA_PASS: ${{ secrets.INSTA_PASS }}
          INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
          # Opcionales: si no existen estos secretos, el script simplemente los ignora
          LEONARDO_MODEL_ID: ${{ secrets.LEONARDO_MODEL_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -u auto_psico_video.py

      - name: Commit and push historial
        run: |
          git config user.name "Psico-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add historial_videos.txt || true
          git commit -m "Vídeo publicado añadido al historial" || echo "Sin cambios en el historial."
          git pull --rebase origin main || true
          git push origin HEAD:main
