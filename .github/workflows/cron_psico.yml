name: Bot Automatico PsicoVideos

on:
  schedule:
    # Publica automáticamente 4 veces al día (horas UTC)
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

# Permiso obligatorio para que GitHub no dé error 403 al guardar el historial
permissions:
  contents: write

jobs:
  publicar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Fabricar y enviar el vídeo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTA_USER: ${{ secrets.INSTA_USER }}
          INSTA_PASS: ${{ secrets.INSTA_PASS }}
          INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -u auto_psico_video.py

      - name: Commit and push historial
        run: |
          git config user.name "Psico-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add historial_videos.txt || true
          git commit -m "Vídeo publicado añadido al historial" || echo "Sin cambios en el historial."
          git pull --rebase origin main || true
          git push origin HEAD:main
