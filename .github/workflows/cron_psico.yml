
name: Bot Automatico PsicoVideos Avatar

on:
  schedule:
    # Horarios UTC: cuatro publicaciones diarias
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

# Evita que dos ejecuciones modifiquen el historial a la vez
concurrency:
  group: publicar-psicovideos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar-video:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu curl git

      - name: Descargar motor Wav2Lip
        run: |
          set -e

          if [ ! -d "Wav2Lip" ]; then
            git clone https://github.com/Rudrabha/Wav2Lip.git
          fi

          mkdir -p Wav2Lip/checkpoints
          mkdir -p Wav2Lip/face_detection/detection/sfd

          curl -fL --retry 3 \
            "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth" \
            -o Wav2Lip/checkpoints/wav2lip_gan.pth

          curl -fL --retry 3 \
            "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/s3fd.pth" \
            -o Wav2Lip/face_detection/detection/sfd/s3fd.pth

          test -s Wav2Lip/checkpoints/wav2lip_gan.pth
          test -s Wav2Lip/face_detection/detection/sfd/s3fd.pth

      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt

      - name: Comprobar archivos necesarios
        run: |
          test -f auto_psico_video.py
          test -f avatar.jpg
          test -d Wav2Lip
          ffmpeg -version
          python -c "import torch, cv2, moviepy, librosa; print('Dependencias OK')"

      - name: Fabricar y enviar el vídeo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTA_USER: ${{ secrets.INSTA_USER }}
          INSTA_PASS: ${{ secrets.INSTA_PASS }}
          INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python -u auto_psico_video.py

      - name: Guardar historial de vídeos
        if: always()
        run: |
          git config user.name "Psico-Bot"
          git config user.email "bot@users.noreply.github.com"

          git pull --rebase origin main

          git add historial_videos.txt

          if git diff --cached --quiet; then
            echo "No hay cambios en el historial."
          else
            git commit -m "Actualizar historial de PsicoVideos"
            git push origin HEAD:main
          fi
