name: Bot Automatico PsicoVideos Avatar

on:
  schedule:
    # Publica automáticamente 4 veces al día (horas UTC)
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

# Permiso obligatorio para que GitHub no dé error 403 al guardar el historial
permissions:
  contents: write

jobs:
  publicar-video:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu curl git

      - name: Preparar Motor de IA (Wav2Lip)
        run: |
          git clone https://github.com/Rudrabha/Wav2Lip.git
          mkdir -p Wav2Lip/checkpoints
          # Descarga simulando ser un navegador Chrome para evitar el bloqueo de Hugging Face
          curl -sL -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth" -o Wav2Lip/checkpoints/wav2lip_gan.pth
          curl -sL -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/s3fd.pth" -o Wav2Lip/face_detection/detection/sfd/s3fd.pth

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          # Fijamos PyTorch a la versión 2.5.1 para evitar bloqueos de seguridad con Wav2Lip
          pip install librosa==0.9.2 torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 opencv-python numpy==1.23.5 moviepy edge-tts

      - name: Fabricar y enviar el vídeo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTA_USER: ${{ secrets.INSTA_USER }}
          INSTA_PASS: ${{ secrets.INSTA_PASS }}
          INSTA_SESSION: ${{ secrets.INSTA_SESSION }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -u auto_psico_video.py

      - name: Commit and push historial
        run: |
          git config user.name "Psico-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add historial_videos.txt || true
          git commit -m "Vídeo de avatar publicado añadido al historial" || echo "Sin cambios en el historial."
          git pull --rebase origin main || true
          git push origin HEAD:main
