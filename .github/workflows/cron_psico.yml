name: Bot Automatico PsicoVideos

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Instalar dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: 3. Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 4. Instalar librerías Python
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 5. Fabricar y subir el vídeo
        env:
          YOUTUBE_STATE: ${{ secrets.YOUTUBE_STATE }}
          TIKTOK_STATE: ${{ secrets.TIKTOK_STATE }}
          LINK_AFILIADO: ${{ secrets.LINK_AFILIADO }}
        run: python -u auto_psico_video.py

      - name: 6. Subir capturas de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            error_*.png
            video_final.mp4
          if-no-files-found: ignore

      - name: 7. Guardar historial de guiones usados
        if: always()
        run: |
          git config user.name "Psico-Bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f historial_videos.txt ] && git add historial_videos.txt
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial."
            exit 0
          fi
          git commit -m "Vídeo publicado añadido al historial"
          git pull --rebase origin main && git push origin HEAD:main
