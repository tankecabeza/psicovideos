name: Bot Automatico PsicoVideos Avatar

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-video:
    runs-on: ubuntu-22.04 # <--- ESTA ES LA LÍNEA QUE HEMOS CAMBIADO
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      # ... (el resto del archivo sigue exactamente igual)
