name: Bot Automatico PsicoVideos

on:
  schedule:
    # Se ejecuta cada 2 horas en punto
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite lanzarlo manualmente cuando quieras desde Actions

jobs:
  publicar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir moviepy edge-tts Pillow numpy requests

      - name: Run python auto_psico_video.py
        run: |
          python auto_psico_video.py

      - name: Commit and push historial
        run: |
          git config user.name "Psico-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add historial_videos.txt || true
          git commit -m "Vídeo publicado añadido al historial" || echo "Sin cambios en el historial."
          git pull --rebase origin main || true
          git push origin HEAD:main || true
